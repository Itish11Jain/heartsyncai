<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>HeartSync AI — A vinyl dedication, just for you 🎵</title>
    <meta name="description" content="Someone dedicated a track to you. Press play to hear your message!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A vinyl dedication, just for you 🎵" />
    <meta property="og:description" content="Someone dedicated a track to you. Press play to hear your message!" />
    <meta property="og:image" content="https://heart-sync-ai.replit.app/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A vinyl dedication, just for you 🎵" />
    <meta name="twitter:description" content="Someone dedicated a track to you. Press play to hear your message!" />
    <meta name="twitter:image" content="https://heart-sync-ai.replit.app/opengraph.jpg" />
    <style>
      html, body { background: #120a04; margin: 0; padding: 0; }
      #hs-splash {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at 50% 42%, #3a1a06 0%, #1e0e02 55%, #120a04 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      }
      #hs-splash-emoji { font-size: 76px; line-height: 1; }
      #hs-splash-title { font-size: 20px; font-weight: 700; color: #ffcc88; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; letter-spacing: 0.06em; text-align: center; }
      #hs-splash-sub { font-size: 13px; color: rgba(255,204,136,0.45); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; text-align: center; }
    </style>
  </head>
  <body>
    <!-- Shown briefly while JS runs; social bots never execute JS so they only see OG tags above -->
    <div id="hs-splash">
      <div id="hs-splash-emoji">🎵</div>
      <p id="hs-splash-title">The record is spinning for you…</p>
      <p id="hs-splash-sub">Your vinyl dedication is ready to play ✦</p>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        window.location.replace('/vinyl?' + p.toString());
      })();
    </script>
  </body>
</html>
