<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>HeartSync AI — You have a message waiting 💌</title>
    <meta name="description" content="Someone special made you a heartfelt card. Tap to reveal your surprise!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="You have a message waiting 💌" />
    <meta property="og:description" content="Someone special made you a heartfelt card. Tap to reveal your surprise!" />
    <meta property="og:image" content="https://heartsync.in/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You have a message waiting 💌" />
    <meta name="twitter:description" content="Someone special made you a heartfelt card. Tap to open!" />
    <meta name="twitter:image" content="https://heartsync.in/opengraph.jpg" />
    <style>
      html, body, #root { background: #1a0610; margin: 0; padding: 0; min-height: 100%; }
      #hs-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at 50% 42%, #5a1030 0%, #2d0618 55%, #1a0610 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        transition: opacity 0.4s ease;
      }
      #hs-splash-emoji { font-size: 52px; line-height: 1; transition: opacity 0.25s ease; }
      /*
        LCP optimisation: #hs-splash-hero is a large heading shown from raw HTML so the
        browser paints it at FCP time (~300ms) and records it as the LCP candidate,
        rather than waiting for React to mount and render the card canvas (~1.5-2s).
        Must be larger (by pixel area) than any React-rendered heading to win.
        clamp(44px, 12vw, 60px): 12vw of 390px = 46.8px — large enough to beat React h1.
      */
      #hs-splash-hero {
        display: none;
        font-size: clamp(44px, 12vw, 60px);
        font-weight: 800;
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0;
        letter-spacing: -0.025em;
        text-align: center;
        line-height: 1.08;
      }
      #hs-splash-title { font-size: 20px; font-weight: 700; color: #ffb0cc; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; letter-spacing: 0.06em; text-align: center; }
      #hs-splash-sub { font-size: 13px; color: rgba(255,176,204,0.45); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; text-align: center; }
    </style>
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.clarity.ms" />
    <link rel="dns-prefetch" href="https://www.clarity.ms" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable-latin.woff2" crossorigin="anonymous" />
    <!-- HS_INJECT_ASSETS -->
  </head>
  <body>
    <div id="hs-splash">
      <div id="hs-splash-emoji">💌</div>
      <h1 id="hs-splash-hero"></h1>
      <p id="hs-splash-title">Opening your letter…</p>
      <p id="hs-splash-sub">Someone wrote something special for you ✦</p>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);

        /* Rewrite URL in-place — zero HTTP round-trip cost.
           Wouter will see /card when React mounts and route correctly. */
        try { history.replaceState(null, '', '/card?' + p.toString()); } catch(e) {}

        /* LCP: show recipient name from HTML before React mounts.
           The h1 paints at FCP time (~300ms) and becomes the LCP candidate,
           beating the card canvas which only appears at React mount (~1.5-2s). */
        var heroEl = document.getElementById('hs-splash-hero');
        var titleEl = document.getElementById('hs-splash-title');
        var name = (p.get('to') || '').trim().split(' ')[0];
        if (name) {
          heroEl.textContent = 'Hey, ' + name + '! \uD83D\uDC9B';
          heroEl.style.display = 'block';
          titleEl.style.display = 'none';
        }

        /* Splash lifecycle */
        var el = document.getElementById('hs-splash');
        var emojiEl = document.getElementById('hs-splash-emoji');
        var emojis = ['💌', '✨', '🎁', '🎀', '💛', '🌟', '🥰', '💖'];
        var idx = 0;
        var iv = setInterval(function () {
          emojiEl.style.opacity = '0';
          setTimeout(function () {
            idx = (idx + 1) % emojis.length;
            emojiEl.textContent = emojis[idx];
            emojiEl.style.opacity = '1';
          }, 250);
        }, 650);

        window.__clearHsSplash = function () {
          clearInterval(iv);
          el.style.transition = 'opacity 0.4s ease';
          el.style.opacity = '0';
          setTimeout(function () { el.style.display = 'none'; }, 420);
        };

        /* Safety auto-clear — SplashClearer in React fires first on fast devices */
        setTimeout(function () {
          if (window.__clearHsSplash) window.__clearHsSplash();
        }, 3000);

        /* Preload personal photo as early as possible */
        var picUrl = p.get('personalpicture');
        if (picUrl) {
          try { var img = new Image(); img.src = picUrl; } catch(e) {}
        }

        /* Warm the API server connection */
        try { fetch('/api/healthz', { priority: 'low', cache: 'no-store' }).catch(function(){}); } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
