<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta name="description" content="Someone wrote the universe a message just for you. Open your cosmic card!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The stars have aligned for you ✨" />
    <meta property="og:description" content="Someone wrote the universe a message just for you. Open your cosmic card!" />
    <meta property="og:image" content="https://heartsync.in/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The stars have aligned for you ✨" />
    <meta name="twitter:description" content="Someone wrote the universe a message just for you. Open your cosmic card!" />
    <meta name="twitter:image" content="https://heartsync.in/opengraph.jpg" />
    <style>
      html, body, #root { background: #020818; margin: 0; padding: 0; min-height: 100%; }
      #hs-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at 50% 42%, #0a1a4a 0%, #040c28 55%, #020818 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        transition: opacity 0.4s ease;
      }
      #hs-splash-emoji { font-size: 76px; line-height: 1; transition: opacity 0.25s ease; }
      #hs-splash-title { font-size: 20px; font-weight: 700; color: #a0c0ff; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; letter-spacing: 0.06em; text-align: center; }
      #hs-splash-sub { font-size: 13px; color: rgba(160,192,255,0.45); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; text-align: center; }
    </style>
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.clarity.ms" />
    <link rel="dns-prefetch" href="https://www.clarity.ms" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable-latin.woff2" crossorigin="anonymous" />
    <!-- HS_INJECT_ASSETS -->
  </head>
  <body>
    <div id="hs-splash">
      <div id="hs-splash-emoji">✨</div>
      <p id="hs-splash-title">Reading the stars for you…</p>
      <p id="hs-splash-sub">Your cosmic message is waiting ✦</p>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);

        /* Rewrite URL in-place — zero HTTP round-trip cost.
           Wouter will see /cosmic when React mounts and route correctly. */
        try { history.replaceState(null, '', '/cosmic?' + p.toString()); } catch(e) {}

        /* Splash lifecycle */
        var el = document.getElementById('hs-splash');
        var emojiEl = document.getElementById('hs-splash-emoji');
        var emojis = ['✨', '🌟', '⭐', '💫', '🌌', '🪐', '🌠'];
        var idx = 0;
        var iv = setInterval(function () {
          emojiEl.style.opacity = '0';
          setTimeout(function () {
            idx = (idx + 1) % emojis.length;
            emojiEl.textContent = emojis[idx];
            emojiEl.style.opacity = '1';
          }, 250);
        }, 650);

        var reactMounted = false;
        window.__clearHsSplash = function () {
          reactMounted = true;
          clearInterval(iv);
          el.style.transition = 'opacity 0.4s ease';
          el.style.opacity = '0';
          setTimeout(function () { el.style.display = 'none'; }, 420);
        };

        /* If React hasn't mounted within 8s (slow mobile / network issue),
           show a "tap to reload" hint instead of a blank black screen. */
        setTimeout(function () {
          if (reactMounted) return;
          clearInterval(iv);
          emojiEl.style.opacity = '1';
          emojiEl.textContent = '🔄';
          document.getElementById('hs-splash-title').textContent = 'Taking longer than usual…';
          document.getElementById('hs-splash-sub').textContent = 'Tap anywhere to reload';
          el.style.cursor = 'pointer';
          el.onclick = function () { window.location.reload(); };
        }, 8000);

        try { fetch('/api/healthz', { priority: 'low', cache: 'no-store' }).catch(function(){}); } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
