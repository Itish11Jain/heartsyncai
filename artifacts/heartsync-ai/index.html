<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>HeartSync AI — You have a surprise card! 🎁</title>
    <meta name="description" content="Someone special made you a personalised card. Tap to reveal your surprise!" />
    <link rel="canonical" href="https://heartsync.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heartsync.in/" />
    <meta property="og:title" content="You have a surprise card! 🎁" />
    <meta property="og:description" content="Someone special made you a personalised card. Tap to reveal your surprise!" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You have a surprise card! 🎁" />
    <meta name="twitter:description" content="Someone special made you a personalised card. Tap to open!" />
    <meta name="twitter:image" content="/opengraph.jpg" />
    <style>
      html, body, #root { background: #050210; margin: 0; padding: 0; min-height: 100%; }
      #hs-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at 50% 40%, #1a0a2e 0%, #0d0618 55%, #050210 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      }
      #hs-splash-emoji { font-size: 52px; transition: opacity 0.25s ease; line-height: 1; }
      /*
        LCP optimisation: #hs-splash-hero is a large heading shown from raw HTML so the
        browser paints it at FCP time (~900ms) and records it as the LCP candidate,
        rather than waiting for React to mount and render the real h1 (~2-4s).
        Shown only on home ("/") and card ("/card") routes via JS below.
      */
      #hs-splash-hero {
        display: none;
        /*
          Must stay LARGER than the React h1 (text-4xl = 2.25rem ≈ 36px) so
          Chrome keeps this element as the LCP candidate (largest area wins).
          clamp(32px, 9vw, 44px) evaluates to ~35px on 390px screens — just
          BELOW 36px — so the React h1 was winning and LCP was recorded at
          React mount time (~1.5-4s) rather than at FCP (~850ms).
          Using clamp(44px, 12vw, 60px): 12vw of 390px = 46.8px → always > 36px.
        */
        font-size: clamp(44px, 12vw, 60px);
        font-weight: 800;
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0;
        letter-spacing: -0.025em;
        text-align: center;
        line-height: 1.08;
      }
      #hs-splash-title { font-size: 20px; font-weight: 700; color: #FFD700; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; letter-spacing: 0.04em; text-align: center; }
      #hs-splash-sub { font-size: 13px; color: rgba(255,255,255,0.3); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; text-align: center; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Preconnect to Google Tag Manager / Analytics early so the async
      analytics script doesn't pay the full DNS+TCP+TLS handshake cost
      on the critical path. dns-prefetch is the fallback for older browsers
      that don't support preconnect.
    -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="preconnect" href="https://www.clarity.ms" />
    <link rel="dns-prefetch" href="https://www.clarity.ms" />
    <!--
      Preload the self-hosted Inter latin variable font so it's fetched in
      parallel with the CSS. Without this, the browser only discovers the
      font *after* parsing the stylesheet, costing ~150–250ms on mobile.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-variable-latin.woff2"
      crossorigin="anonymous"
    />
    <!--
      Vite auto-injects <link rel="modulepreload"> for the entry chunk and
      its entire static-import graph at build time (in the built HTML, not
      the source). A manual hint here pointing to /src/main.tsx would 404
      in production because the built file has a content-hash name like
      /assets/index-abc123.js — wasting a round trip on every page load.
      No manual modulepreload needed; Vite handles it correctly at build time.
    -->
    <script>
      /* Block GA on Replit dev previews and localhost — production only. */
      (function(){
        var h = window.location.hostname;
        var isDev = h === 'localhost' || h === '127.0.0.1' || h.indexOf('.replit.dev') !== -1;
        if (isDev) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Q7ZC1EMZJE';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-Q7ZC1EMZJE');
      })();
    </script>
    <script>
      /* Microsoft Clarity — session recordings + heatmaps.
         Project ID is injected at build time from the VITE_CLARITY_PROJECT_ID
         env var, which is set ONLY in the production environment (never in the
         repo or in dev), so the placeholder below stays literal in dev/preview
         builds. As defence-in-depth we ALSO positively gate to the production
         host, so the script can never run anywhere but the live site. */
      (function(){
        var id = "%VITE_CLARITY_PROJECT_ID%";
        if (!id || id.indexOf('%') !== -1) return;
        var h = window.location.hostname;
        var isProd = h === 'heartsync.in' || h === 'www.heartsync.in';
        if (!isProd) return;
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window,document,'clarity','script',id);
      })();
    </script>
    <script>
      /* Meta Pixel — conversion tracking. Production only. */
      (function(){
        var h = window.location.hostname;
        var isDev = h === 'localhost' || h === '127.0.0.1' || h.indexOf('.replit.dev') !== -1;
        if (isDev) return;
        !function(f,b,e,v,n,t,s){
          if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)
        }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init','1510201040837057');
        fbq('track','PageView');
      })();
    </script>
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1510201040837057&ev=PageView&noscript=1" />
    </noscript>
  </head>
  <body>
    <!-- Native pre-React splash — eliminates white flash on card links -->
    <div id="hs-splash">
      <div id="hs-splash-emoji">🎁</div>
      <!--
        LCP hero heading: shown immediately from HTML so the browser records
        it as the LCP candidate at FCP time (~900ms) rather than waiting for
        React to mount. JS below switches content per route.
      -->
      <h1 id="hs-splash-hero"></h1>
      <p id="hs-splash-title">Your surprise is loading…</p>
      <p id="hs-splash-sub">Something special was made just for you ✨</p>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var path = window.location.pathname;
        var isCard = path === '/card' || path.endsWith('/card');
        var isHome = path === '/' || path === '';
        var isSend = path === '/send' || path.endsWith('/send');
        var isSender = p.get('sender') === '1';
        var isPreview = p.get('preview') === '1';
        var el = document.getElementById('hs-splash');
        var emojiEl = document.getElementById('hs-splash-emoji');
        var heroEl = document.getElementById('hs-splash-hero');
        var titleEl = document.getElementById('hs-splash-title');
        var subEl = document.getElementById('hs-splash-sub');

        // Route-specific modulepreloads injected from window.__hsChunks.
        // window.__hsChunks is written by scripts/inject-preloads.mjs at build time
        // with content-hashed asset filenames. Injecting these here — before any JS
        // runs — lets the browser fetch them in parallel with react-vendor instead of
        // discovering them 2-4 hops later via sequential lazy() resolution.
        //
        // /card needs: ct (card-templates, 43 KB gzip).
        // /send needs: ct + ck (clerk, 88 KB) + cal (ClerkAuthLayer) + sd (send page).
        // Without /send preloads the waterfall is 4 × 300 ms Indian RTT = ~1.2 s wasted
        // BEFORE the Clerk chunk even starts downloading.
        if (window.__hsChunks) {
          var chunks = window.__hsChunks;
          var toPreload = isCard ? ['ct'] : isSend ? ['ct', 'ck', 'cal', 'sd'] : [];
          for (var ci = 0; ci < toPreload.length; ci++) {
            var href = chunks[toPreload[ci]];
            if (href) {
              var l = document.createElement('link');
              l.rel = 'modulepreload'; l.crossOrigin = ''; l.href = href;
              document.head.appendChild(l);
            }
          }
        }

        // Skip splash when sender or preview query params are set (those flows render their own UI fast)
        if ((isCard && (isSender || isPreview))) {
          el.style.display = 'none';
          return;
        }

        // Pick splash copy based on route
        var emojis;
        if (isCard) {
          emojis = ['🎁', '✨', '💌', '🎀', '💛', '🌟', '🥰', '🎊', '💖'];
          // LCP: show recipient name large from HTML so browser records it
          // as the LCP element at FCP time (~900ms) instead of at React mount.
          var name = (p.get('to') || '').trim().split(' ')[0]; // first name only
          heroEl.textContent = name ? ('Hey, ' + name + '! \uD83D\uDC9B') : 'You have a surprise! \uD83D\uDC9B';
          heroEl.style.display = 'block';
          titleEl.style.display = 'none';
          subEl.textContent = 'Something special was made just for you \u2728';
        } else if (isHome) {
          emojis = ['\uD83D\uDC9B', '\u2728', '\uD83D\uDC96', '\uD83C\uDF38', '\uD83D\uDCAB', '\uD83E\uDD70', '\uD83D\uDC9E', '\uD83C\uDF1F'];
          // LCP: show the hero heading from HTML so it paints at FCP time.
          // textContent is safe (no HTML injection); pre-line gives us the
          // line break without innerHTML.
          heroEl.textContent = 'Send love\nin a card.';
          heroEl.style.whiteSpace = 'pre-line';
          heroEl.style.display = 'block';
          titleEl.style.display = 'none';
          subEl.textContent = 'Personalised cards for every occasion \u2728';
        } else if (isSend) {
          emojis = ['\uD83D\uDC8C', '\u2728', '\uD83D\uDC96', '\uD83C\uDF38', '\uD83D\uDCAB', '\uD83E\uDD70', '\uD83D\uDC9E', '\uD83C\uDF1F'];
          // LCP: show a large hero heading from HTML so the browser records it as
          // the LCP element at FCP time (~900 ms) instead of at React mount time.
          // Without this, the LCP candidate is the form heading which only appears
          // after ClerkAuthLayer + clerk (88 KB) + send + card-templates all load —
          // a 4-hop waterfall that puts LCP at 6-7 s on Indian 4G.
          heroEl.textContent = 'Create a card \uD83D\uDC8C';
          heroEl.style.display = 'block';
          titleEl.style.display = 'none';
          subEl.textContent = 'Make someone\u2019s day special \u2728';
        } else {
          // /sign-in, /analytics and all other routes — generic branded splash
          emojis = ['\uD83D\uDC9B', '\u2728', '\uD83D\uDC96', '\uD83C\uDF38', '\uD83D\uDCAB', '\uD83E\uDD70', '\uD83D\uDC9E', '\uD83C\uDF1F'];
          titleEl.textContent = 'HeartSync AI';
          subEl.textContent = 'Loading your love language\u2026';
        }

        emojiEl.textContent = emojis[0];
        var idx = 0;
        var iv = setInterval(function () {
          emojiEl.style.opacity = '0';
          setTimeout(function () {
            idx = (idx + 1) % emojis.length;
            emojiEl.textContent = emojis[idx];
            emojiEl.style.opacity = '1';
          }, 250);
        }, 650);

        window.__clearHsSplash = function () {
          clearInterval(iv);
          el.style.transition = 'opacity 0.4s ease';
          el.style.opacity = '0';
          setTimeout(function () { el.style.display = 'none'; }, 420);
        };

        // Safety fallback — auto-clear after the route-appropriate delay.
        // /send: keep the splash visible for up to 3 s. With chunk preloads the
        //   form renders in ~1.5-2 s on Indian 4G; React's SplashClearer clears
        //   it sooner once the Send component mounts. The 3 s cap ensures users
        //   never stare at the splash on a slow connection without seeing the form.
        //   Without any cap the 1 s default caused a blank screen while Clerk's
        //   88 KB chunk finished downloading after the splash cleared early.
        // /card + / (home): production data shows React mounts at ~1950ms p50 on
        //   Android — so the old 1s cap was clearing the splash 950ms too early,
        //   leaving a blank screen until React rendered.  3s matches /send and
        //   is safe: SplashClearer fires first (at React mount time) on fast devices.
        // All other routes: 1 s is still fine — they mount quickly.
        setTimeout(function () {
          if (window.__clearHsSplash) window.__clearHsSplash();
        }, (isSend || isCard || isHome) ? 3000 : 1000);

        // Preload personal photo as early as possible — the API takes ~3.5s
        // and React mounts 1-2s after HTML, so starting here saves ~1-2s of
        // latency before the ring even appears. Browser caches the decoded
        // image so PolaroidFrame's <img> finds it instantly on mount.
        if (isCard) {
          var picUrl = p.get('personalpicture');
          if (picUrl) {
            try {
              var preloadImg = new Image();
              preloadImg.src = picUrl;
            } catch(e) {}
          }
        }

        // Warm the API server connection immediately so the first real API
        // call (usage check, card creation) doesn't pay the full TCP+TLS
        // handshake cost. Low-priority so it never competes with JS loading.
        try {
          fetch('/api/healthz', { priority: 'low', cache: 'no-store' }).catch(function(){});
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
