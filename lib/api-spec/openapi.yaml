openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: report
    description: Intelligence report generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /report/generate:
    post:
      operationId: generateReport
      tags: [report]
      summary: Generate a date intelligence report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReportBody"
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceReport"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GenerateReportBody:
      type: object
      properties:
        partnerName:
          type: string
          description: Name of the date partner
        occasion:
          type: string
          description: Type of date occasion (e.g., coffee, dinner, movie)
        knownDetails:
          type: string
          description: Any known details about the partner
        vibe:
          type: string
          description: The vibe or mood you want to set
      required:
        - partnerName
        - occasion

    ReportSection:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        items:
          type: array
          items:
            type: string
      required:
        - title
        - content

    IntelligenceReport:
      type: object
      properties:
        partnerName:
          type: string
        openingGambit:
          $ref: "#/components/schemas/ReportSection"
        iqQuestions:
          $ref: "#/components/schemas/ReportSection"
        auraCheck:
          $ref: "#/components/schemas/ReportSection"
        conversationClosers:
          $ref: "#/components/schemas/ReportSection"
      required:
        - partnerName
        - openingGambit
        - iqQuestions
        - auraCheck
        - conversationClosers

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
